_version: 1
common:
  warn: "警告"
  done: "完了。"

new:
  prereq_missing: "PATH にツールがありません: %{tools} — `dcbot start` 前にインストールしてください。"
  dir_exists: "%{dir} には既に .discord-state があります — そこで `dcbot doctor` を実行するか別のディレクトリを選んでください。"
  name_taken: "ボット名 '%{name}' は既に登録されています — `dcbot list` で確認してください。"
  guide: |
    続行する前に Discord Developer Portal (https://discord.com/developers/applications) で:
      1. New Application → 名前を付ける
      2. Bot → Reset Token → トークンをコピー (一度だけ表示)
      3. Bot → Privileged Gateway Intents → "Message Content Intent" を有効化
    以下にトークンを貼り付けてください — 検証後に dcbot が招待 URL を表示します。
  guide_ready: "続行する"
  token_prompt: "Discord ボットトークンを貼り付け"
  token_required: "非対話モードには --token <TOKEN> が必要です (端末で `dcbot new <name> --yes` を実行すればプロンプトで入力できます)"
  token_ok: "トークン有効 — ボット: %{tag} (%{id})"
  invite_url: |
    ボットをサーバーに追加 — この招待 URL を開いてください:
      %{url}
    (ボットが DM を送るために必須 — `dcbot invite %{name} --open` で再表示)
  open_invite: "招待 URL をブラウザで開きますか？"
  intent_missing: "Message Content Intent がオフです — Bot → Privileged Gateway Intents で有効化してください。無効だとボットはメッセージ本文を読めません。"
  owner_prompt: "あなたの Discord ユーザー ID (snowflake) (空 = pairing モードのまま)"
  owner_invalid: "'%{id}' は Discord snowflake ではありません (17-20 桁の数字)"
  created: "デプロイを作成しました: %{dir}"
  start_now: "今すぐボットセッションを起動しますか (tmux)?"
  start_hint: "後で: `dcbot start %{name}`"

