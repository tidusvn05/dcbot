  token_ok: "token hợp lệ — bot identity: %{tag} (%{id})"
  invite_url: |
    Add bot vào một server — mở invite URL này:
      %{url}
    (bắt buộc để bot DM được với bạn — `dcbot invite %{name} --open` mở lại)
  open_invite: "Mở invite URL trong browser ngay?"
  intent_missing: "Message Content Intent đang TẮT — bật tại Bot → Privileged Gateway Intents, nếu không bot không đọc được nội dung tin nhắn."
  owner_prompt: "Discord user ID snowflake của bạn (để trống = giữ pairing mode)"
  owner_invalid: "'%{id}' không phải Discord snowflake (17-20 chữ số)"
