new:
  prereq_missing: "thiếu tools trên PATH: %{tools} — cài trước khi `dcbot start`."
  dir_exists: "%{dir} đã chứa .discord-state — chạy `dcbot doctor` tại đó hoặc chọn thư mục khác."
  name_taken: "tên bot '%{name}' đã được đăng ký — `dcbot list` để xem tất cả."
  guide: |
    Trước khi tiếp tục, vào Discord Developer Portal (https://discord.com/developers/applications):
      1. New Application → đặt tên
      2. Bot → Reset Token → copy token (chỉ hiện một lần)
      3. Bot → Privileged Gateway Intents → bật "Message Content Intent"
    Dán token ở dưới — dcbot sẽ in invite URL sau khi validate.
  guide_ready: "Sẵn sàng tiếp tục"
  token_prompt: "Dán Discord bot token"
